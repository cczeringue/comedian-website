<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Manager | Private Portal</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../styles.css?v=34">
    <style>
        .admin-page {
            min-height: 100vh;
            padding: 2.25rem 0 4rem;
        }
        .admin-shell {
            max-width: 720px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 1.2rem;
        }
        .admin-title {
            margin: 0 0 0.45rem;
            font-family: var(--font-display);
            color: var(--text-primary);
        }
        .admin-subtitle {
            margin: 0 0 1rem;
            color: var(--text-secondary);
        }
        .admin-form-row {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            margin-bottom: 0.85rem;
        }
        .admin-form-row label {
            font-family: var(--font-ui);
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 700;
        }
        .admin-track-label {
            font-family: var(--font-ui);
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 700;
        }
        .admin-track-radios {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem 1.1rem;
        }
        .admin-track-option {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-family: var(--font-ui);
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: none;
            letter-spacing: normal;
            color: var(--text-primary);
            cursor: pointer;
        }
        .admin-track-option input {
            accent-color: var(--accent-orange);
        }
        .admin-input {
            width: 100%;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 0.7rem 0.75rem;
            background: var(--bg-darker);
            color: var(--text-primary);
            font-family: var(--font-ui);
        }
        .admin-textarea {
            min-height: 5.5rem;
            resize: vertical;
            line-height: 1.5;
        }
        .admin-featured-row {
            margin-top: 0.65rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-light);
        }
        .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .admin-status {
            margin-top: 0.9rem;
            padding: 0.65rem 0.75rem;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-family: var(--font-ui);
            color: var(--text-secondary);
        }
        .admin-status.error {
            border-color: rgba(255, 120, 120, 0.45);
            color: #ffb4b4;
        }
        .admin-status.success {
            border-color: rgba(147, 230, 152, 0.45);
            color: #b8f5bb;
        }
        .preview-card {
            margin-top: 1rem;
            background: var(--bg-darker);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            overflow: hidden;
        }
        .preview-thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
        }
        .preview-content {
            padding: 0.8rem;
        }
        .preview-title {
            margin: 0 0 0.4rem;
            font-family: var(--font-display);
            color: var(--text-primary);
        }
        .preview-text {
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main class="admin-page">
        <div class="container">
            <section class="admin-shell" id="lockScreen">
                <h1 class="admin-title">Private Media Manager</h1>
                <p class="admin-subtitle">Enter your admin key to unlock this portal.</p>
                <div class="admin-form-row">
                    <label for="adminKeyInput">Admin key</label>
                    <input id="adminKeyInput" class="admin-input" type="password" autocomplete="off" placeholder="Your MEDIA_ADMIN_KEY">
                </div>
                <div class="admin-actions">
                    <button type="button" class="btn btn-primary" id="unlockBtn">Unlock</button>
                </div>
                <div id="lockStatus" class="admin-status" hidden></div>
            </section>

            <section class="admin-shell" id="managerPanel" hidden>
                <h2 class="admin-title">Add media</h2>
                <p class="admin-subtitle">Paste a URL, fetch metadata, fix the title or description if needed, then save. Use “Feature on homepage” for the Press section carousel.</p>

                <div class="admin-form-row">
                    <label for="mediaUrlInput">Media URL</label>
                    <input id="mediaUrlInput" class="admin-input" type="url" placeholder="https://youtube.com/... or podcast URL">
                </div>

                <div class="admin-form-row" aria-label="Project or category">
                    <span class="admin-track-label">Show under</span>
                    <div class="admin-track-radios" role="radiogroup" aria-label="Gallery category">
                        <label class="admin-track-option"><input type="radio" name="mediaTrack" value="standup" checked> Stand-Up</label>
                        <label class="admin-track-option"><input type="radio" name="mediaTrack" value="drillmaster"> The Drill Master</label>
                        <label class="admin-track-option"><input type="radio" name="mediaTrack" value="luigi"> Luigi the Musical</label>
                    </div>
                </div>

                <div class="admin-actions">
                    <button type="button" class="btn btn-secondary" id="fetchBtn">Fetch Metadata</button>
                    <button type="button" class="btn btn-primary" id="saveBtn" disabled>Save to Gallery</button>
                    <button type="button" class="btn btn-tertiary" id="clearBtn">Clear</button>
                </div>

                <div id="managerStatus" class="admin-status" hidden></div>

                <article id="previewCard" class="preview-card" hidden>
                    <img id="previewThumb" class="preview-thumb" alt="">
                    <div class="preview-content">
                        <div class="admin-form-row">
                            <label for="editTitle">Title</label>
                            <input id="editTitle" class="admin-input" type="text" autocomplete="off" maxlength="500">
                        </div>
                        <div class="admin-form-row">
                            <label for="editDesc">Description</label>
                            <textarea id="editDesc" class="admin-input admin-textarea" maxlength="2000" rows="4"></textarea>
                        </div>
                        <p id="previewMeta" class="preview-text"></p>
                        <label class="admin-track-option admin-featured-row">
                            <input type="checkbox" id="editFeatured" name="editFeatured">
                            Feature on homepage (Press carousel)
                        </label>
                    </div>
                </article>
            </section>
        </div>
    </main>

    <script src="../media-admin.js"></script>
</body>
</html>
