<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media | Caleb Zeringue</title>
    <meta name="description" content="Press, podcast appearances, interviews, and clips for Caleb Zeringue.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css?v=51">
    <style>
        .media-page {
            min-height: 100vh;
            padding: 2rem 0 4rem;
        }
        .media-page .proof-shell {
            max-width: var(--container-width);
        }
        .media-page .press-media-grid {
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <main class="media-page proof-section">
        <div class="container">
            <div class="proof-shell">
                <div class="proof-intro">
                    <div>
                        <p class="proof-kicker">Press & Media</p>
                        <h1 class="proof-title">All sightings</h1>
                        <p class="proof-subtitle" style="margin-top:0.5rem;color:var(--text-secondary);font-size:0.95rem;">Podcast appearances, interviews, articles, and clips.</p>
                    </div>
                    <div class="proof-actions">
                        <a href="index.html" class="btn btn-primary">&larr; Home</a>
                    </div>
                </div>
                <div class="press-grid-section" data-media-page-section>
                    <div class="media-carousel-tablist" role="tablist" aria-label="Filter media by project">
                        <button type="button" class="media-filter-tab" role="tab" id="media-tab-all" aria-selected="true" aria-controls="media-page-panel" data-press-tab="all" tabindex="0">All</button>
                        <button type="button" class="media-filter-tab" role="tab" id="media-tab-standup" aria-selected="false" aria-controls="media-page-panel" data-press-tab="standup" tabindex="-1">Stand-Up</button>
                        <button type="button" class="media-filter-tab" role="tab" id="media-tab-drillmaster" aria-selected="false" aria-controls="media-page-panel" data-press-tab="drillmaster" tabindex="-1">The Drill Master</button>
                        <button type="button" class="media-filter-tab" role="tab" id="media-tab-luigi" aria-selected="false" aria-controls="media-page-panel" data-press-tab="luigi" tabindex="-1">Luigi the Musical</button>
                    </div>
                    <div id="media-page-panel" role="tabpanel" aria-labelledby="media-tab-all" tabindex="0">
                        <div class="press-media-grid" data-press-media-grid>
                            <p class="appearance-empty">Loading press &amp; media&hellip;</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="media.js?v=10"></script>
</body>
</html>
